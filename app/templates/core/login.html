{% extends 'base.html' %}
{% load static %}

{% block title %}Core Admin - Login{% endblock %}

{% block content %}
<div class="container-fluid d-flex align-items-center justify-content-center bg-dark-pink" style="min-height: 89.5vh; overflow: hidden;">
    <div class="row w-100 justify-content-center">
        <div class="col-5">
            <div class="card shadow-lg border-0 rounded-4 bg-white">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <h3 class="fw-bold text-marycats-dark-pink mb-2">Core Admin</h3>
                        <p class="text-muted small">Acesso administrativo</p>
                    </div>
                    
                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                                {{ message }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                            </div>
                        {% endfor %}
                    {% endif %}
                    
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="username" class="form-label text-dark fw-semibold">Usuário</label>
                            <input type="text" class="form-control rounded-3" id="username" name="username" required>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label text-dark fw-semibold">Senha</label>
                            <input type="password" class="form-control rounded-3" id="password" name="password" required>
                        </div>
                        <div class="d-grid mb-3">
                            <button type="submit" class="btn bg-marycats-dark-pink text-white btn-lg rounded-3 fw-bold border-0">
                                <i class="fas fa-sign-in-alt me-2"></i>Entrar
                            </button>
                        </div>
                    </form>
                    
                    <div class="text-center">
                        <a href="{% url 'tela_comecar' %}" class="text-muted text-decoration-none small">
                            <i class="fas fa-arrow-left me-1"></i>Voltar ao totem
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
